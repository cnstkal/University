<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>고객관계관리 시험 요약</title>
<style>
:root{--bg:#f7f2e8;--card:#fffdf8;--ink:#2d2b26;--mut:#6f6a5f;--line:#e8e0cf;--ac:#3f6b5e;
--c0:#e3eee6;--c1:#f6e6d3;--c2:#e1ebf3;--c3:#f3e1e3;--c4:#ebe4f3;--c5:#f4efc9}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
html,body{width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
header{padding:calc(env(safe-area-inset-top,0px) + 20px) 18px 10px}
h1{font-size:22px;font-weight:800}
header p{color:var(--mut);font-size:13px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 14px 10px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
nav button{font:inherit;font-size:12.5px;line-height:1.25;padding:7px 2px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:12px;touch-action:manipulation}
nav button span{display:block;font-size:18px}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
main{padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 40px)}
.intro{background:var(--ac);color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:14px;font-size:14px}
.intro b{display:block;font-size:17px;margin-bottom:2px}
.s{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.s h2{font-size:16.5px;font-weight:800;display:flex;gap:8px;align-items:center}
.s h2 i{font-style:normal;font-size:20px}
.q{margin:8px 0 12px;background:var(--c5);border-radius:12px;padding:8px 12px;font-size:13.5px;color:#4d4a2a}
.q::before{content:"쉽게 말해 ";font-weight:800}
.blk{margin-top:10px}
.r{padding:7px 0;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.r+.r{border-top:1px dashed var(--line)}
.p{font-size:13px;padding:2px 10px;border-radius:99px;font-weight:700}
.r span{font-size:14px;color:#3d3b35}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g .t{border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:3px}
.g .t:last-child:nth-child(odd){grid-column:span 2}
.t b{font-size:14px}.t span{font-size:13px;color:#46433b;line-height:1.5}
.f{list-style:none}
.f li{display:flex;gap:10px;position:relative;padding-bottom:12px}
.f li:last-child{padding-bottom:0}
.f li::before{content:"";position:absolute;left:12px;top:26px;bottom:2px;width:2px;background:var(--line)}
.f li:last-child::before{display:none}
.f i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ac);color:#fff;font-style:normal;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:1}
.f b{display:block;font-size:14.5px}.f span{font-size:13px;color:var(--mut)}
.v{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.v>div{border-radius:12px;padding:10px}
.v b{display:block;font-size:14px;margin-bottom:4px}
.v p{font-size:13px;line-height:1.5;color:#46433b;padding:2px 0}
.cmp{display:grid;grid-template-columns:.8fr 1fr 1fr;gap:1px;background:var(--line);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.cmp div{background:var(--card);padding:7px 8px;font-size:12.5px;line-height:1.45}
.cmp .h{font-weight:800;text-align:center}
.cmp .l{font-weight:700;color:var(--ac);background:#f4f1e8}
.big{text-align:center;font-weight:800;font-size:16px;line-height:1.5;background:var(--c0);color:#27483e;border-radius:12px;padding:12px 10px}
.k{margin-top:12px;padding:9px 12px;border-left:4px solid var(--ac);background:#f1f5f0;border-radius:6px;font-size:13.5px;font-weight:600;color:#27483e}
.k::before{content:"📌 "}
.c0{background:var(--c0)}.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}.c4{background:var(--c4)}.c5{background:var(--c5)}
</style>
</head>
<body>
<header><h1>📚 고객관계관리 시험 요약</h1><p>탭을 눌러 장을 바꿔요</p></header>
